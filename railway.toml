# Railway deploy config
#
# This site is a Next.js static export (`output: "export"`), so we don't run
# a Next.js server in production. We build the static `out/` folder and serve
# it with the `serve` package on $PORT.

[build]
builder = "NIXPACKS"
# `npm install` (not `npm ci`) — Nixpacks mounts node_modules/.cache as a cache
# volume, and `npm ci` fails with EBUSY trying to wipe a locked node_modules.
# `npm install` syncs to the lockfile in place without touching the cache mount.
buildCommand = "npm install --prefer-offline --no-audit --no-fund && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/en/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
